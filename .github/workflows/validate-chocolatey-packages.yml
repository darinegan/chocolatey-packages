name: Validate Chocolatey packages

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-chocolatey-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_ROOT: automatic

jobs:
  detect-changes:
    name: Detect validation scope
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - name: Detect package automation changes
        id: detect
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:GITHUB_EVENT_NAME -ne 'pull_request') {
            "relevant=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host 'Manual validation run; running all validation.'
            exit 0
          }

          $files = @(
            gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename'
          )
          $patterns = @(
            '^automatic/',
            '^setup/au_setup\.ps1$',
            '^update_all\.ps1$',
            '^test_all\.ps1$',
            '^tools/PSModules/',
            '^\.github/workflows/(validate-chocolatey-packages|update-chocolatey-packages|publish-chocolatey-packages)\.yml$',
            '^\.github/dependabot\.yml$'
          )

          $relevant = $false
          foreach ($file in $files) {
            $normalized = $file -replace '\\', '/'
            if ($patterns | Where-Object { $normalized -match $_ }) {
              $relevant = $true
              break
            }
          }

          "relevant=$($relevant.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($relevant) {
            Write-Host 'Package automation changes detected.'
          } else {
            Write-Host 'No package automation changes detected; heavy validation will be skipped.'
          }

  verify-module:
    name: Verify Chocolatey-AU module
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout v4

      - name: Install Chocolatey-AU
        shell: powershell
        run: choco install chocolatey-au -y --no-progress

      - name: Verify Chocolatey-AU commands
        shell: powershell
        run: |
          Import-Module Chocolatey-AU

          $cmds = Get-Command -Module Chocolatey-AU -CommandType Function, Alias |
                  Select-Object -ExpandProperty Name
          Write-Host "Exported commands: $($cmds -join ', ')"

          $required = @('Update-AUPackages', 'updateall', 'update', 'Get-AUPackages')
          foreach ($cmd in $required) {
            if ($cmd -notin $cmds) {
              Write-Error "Required command '$cmd' not found in Chocolatey-AU module."
              exit 1
            }
          }

  smoke-test-updates:
    name: Smoke-test update scripts
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - smimesign
          - service-fabric
          - service-fabric-sdk
          - service-fabric-tools
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout v4

      - name: Install Chocolatey-AU
        shell: powershell
        run: choco install chocolatey-au -y --no-progress

      - name: Run update.ps1 in WhatIf mode
        shell: powershell
        run: |
          Import-Module Chocolatey-AU
          $global:au_WhatIf = $true

          $packageDir = Join-Path $env:GITHUB_WORKSPACE "automatic\${{ matrix.package }}"
          Push-Location $packageDir
          try {
            Write-Host "Running update.ps1 from: $packageDir (WhatIf)"
            & ".\update.ps1"
          } catch {
            $msg = $_.Exception.Message
            if ($msg -match 'Unable to connect|WebException|timeout|NameResolution') {
              Write-Warning "Network error ignored in CI: $msg"
            } else {
              throw
            }
          } finally {
            Pop-Location
          }

  pack-packages:
    name: Pack Chocolatey packages
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - smimesign
          - service-fabric
          - service-fabric-sdk
          - service-fabric-tools
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout v4

      - name: Pack package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $package = '${{ matrix.package }}'
          $packageDir = Join-Path $env:GITHUB_WORKSPACE "automatic\$package"
          $outputDir = Join-Path $env:GITHUB_WORKSPACE 'automatic\_output'

          if (Test-Path $outputDir) {
            Remove-Item $outputDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $outputDir | Out-Null

          Push-Location $packageDir
          try {
            choco pack ".\$package.nuspec" --out "$outputDir"
            if ($LASTEXITCODE -ne 0) {
              throw "choco pack failed for $package with exit code $LASTEXITCODE."
            }
          } finally {
            Pop-Location
          }

          $packages = @(Get-ChildItem -Path $outputDir -Filter "$package.*.nupkg")
          if ($packages.Count -ne 1) {
            throw "Expected exactly one package matching '$package.*.nupkg' in $outputDir; found $($packages.Count)."
          }
          Write-Host "Produced package: $($packages[0].FullName)"

  workflow-security:
    name: Check workflow security
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout v4

      - name: Validate workflow invariants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $violations = New-Object System.Collections.Generic.List[string]
          $workflowFiles = Get-ChildItem -Path '.github\workflows' -Filter '*.yml' -File

          foreach ($file in $workflowFiles) {
            $lines = Get-Content -Path $file.FullName
            $content = $lines -join "`n"

            if ($content -match '(?m)^\s*pull_request_target\s*:') {
              $violations.Add("$($file.Name): pull_request_target is not allowed.")
            }

            if ($content -notmatch '(?m)^permissions:\s*\{\}\s*$') {
              $violations.Add("$($file.Name): top-level permissions must be {}.")
            }

            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^\s*uses:\s*([^@\s#]+)@([^\s#]+)') {
                $action = $Matches[1]
                $ref = $Matches[2]
                if ($action -notmatch '^\.\/' -and $ref -notmatch '^[0-9a-f]{40}$') {
                  $violations.Add("$($file.Name): line $($i + 1) uses $action@$ref instead of a full 40-character SHA.")
                }
              }
            }
          }

          if ($violations.Count -gt 0) {
            $violations | ForEach-Object { Write-Error $_ }
            throw 'Workflow security checks failed.'
          }

          Write-Host 'Workflow security checks passed.'

  validation-result:
    name: Validate Chocolatey packages result
    needs:
      - detect-changes
      - verify-module
      - smoke-test-updates
      - pack-packages
      - workflow-security
    if: always()
    runs-on: windows-latest
    permissions: {}
    steps:
      - name: Report validation result
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $relevant = '${{ needs.detect-changes.outputs.relevant }}'
          $results = [ordered]@{
            'detect-changes' = '${{ needs.detect-changes.result }}'
            'verify-module' = '${{ needs.verify-module.result }}'
            'smoke-test-updates' = '${{ needs.smoke-test-updates.result }}'
            'pack-packages' = '${{ needs.pack-packages.result }}'
            'workflow-security' = '${{ needs.workflow-security.result }}'
          }

          foreach ($entry in $results.GetEnumerator()) {
            Write-Host "$($entry.Key): $($entry.Value)"
          }

          $required = @('detect-changes', 'workflow-security')
          if ($relevant -eq 'true') {
            $required += @('verify-module', 'smoke-test-updates', 'pack-packages')
          }

          $failed = @(
            foreach ($job in $required) {
              if ($results[$job] -ne 'success') { "$job=$($results[$job])" }
            }
          )

          if ($failed.Count -gt 0) {
            throw "Required validation failed: $($failed -join ', ')"
          }

          if ($relevant -ne 'true') {
            Write-Host 'No package automation changes detected; validation gate passed.'
          } else {
            Write-Host 'All required package validation jobs passed.'
          }
